<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UIA record &amp; replay path</title>
  <style>
    :root {
      --background: #f7f7f5;
      --foreground: #1c1c1a;
      --card: #ffffff;
      --muted: #ecece8;
      --muted-foreground: #6b6b66;
      --border: #d8d8d2;
      --blue: #2f6fed;
      --orange: #c56a1a;
      --success: #1f7a45;
      --accent: #2f6fed;
      --purple: #7a4fd4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #141413;
        --foreground: #f2f2ee;
        --card: #1e1e1c;
        --muted: #2a2a27;
        --muted-foreground: #a3a39c;
        --border: #3a3a35;
        --blue: #6b9bff;
        --orange: #e08a3c;
        --success: #3db872;
        --accent: #6b9bff;
        --purple: #b08aff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px;
      font: 14px/1.45 system-ui, sans-serif;
      color: var(--foreground); background: var(--background);
    }
    #uia-flow {
      display: flex; flex-direction: column; gap: 24px;
      max-width: 960px; margin: 0 auto;
    }
    .vis-sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
    .vis-controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
    .vis-form-label {
      display: flex; flex-direction: column; gap: 6px;
      font-size: 13px; color: var(--muted-foreground);
    }
    .vis-form-select, .vis-toggle-group {
      min-width: 160px; padding: 8px 10px;
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--card); color: var(--foreground); font: inherit;
    }
    .vis-toggle-group {
      display: inline-flex; gap: 0; padding: 0; min-width: 0; overflow: hidden;
    }
    .vis-toggle-group label {
      padding: 8px 14px; cursor: pointer; border-right: 1px solid var(--border);
      color: var(--muted-foreground); user-select: none;
    }
    .vis-toggle-group label:last-child { border-right: 0; }
    .vis-toggle-group input { position: absolute; opacity: 0; pointer-events: none; }
    .vis-toggle-group input:checked + label {
      background: color-mix(in srgb, var(--accent) 14%, var(--card));
      color: var(--foreground); font-weight: 500;
    }
    .vis-toggle-group input:focus-visible + label {
      outline: 2px solid var(--accent); outline-offset: -2px;
    }
    .vis-column { display: flex; flex-direction: column; gap: 12px; }
    .vis-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .vis-chart-meta {
      display: flex; flex-wrap: wrap; justify-content: space-between;
      gap: 12px; align-items: flex-start;
    }
    .vis-chart-meta-copy h3 { margin: 0; font-size: 16px; font-weight: 500; }
    .vis-chart-meta-copy span {
      display: block; margin-top: 2px; color: var(--muted-foreground); font-size: 13px;
    }
    .vis-legend {
      display: flex; flex-wrap: wrap; gap: 12px;
      font-size: 13px; color: var(--muted-foreground);
    }
    .vis-legend-item { display: inline-flex; align-items: center; gap: 6px; }
    .vis-swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
    .vis-swatch.vis-blue { background: var(--blue); }
    .vis-swatch.vis-orange { background: var(--orange); }
    .vis-swatch.vis-success { background: var(--success); }
    .vis-swatch.vis-purple { background: var(--purple); }
    .vis-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px;
    }
    .vis-badge {
      display: inline-flex; align-items: center; padding: 2px 8px;
      border-radius: 999px; border: 1px solid var(--border);
      font-size: 12px; background: var(--muted);
    }
    .vis-badge.vis-accent {
      border-color: color-mix(in srgb, var(--accent) 40%, var(--border));
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 12%, transparent);
    }
    .vis-text-muted { color: var(--muted-foreground); }
    .vis-text-small { font-size: 12px; }
    .vis-code-block {
      margin: 0; background: var(--muted); border-radius: 8px; padding: 10px 12px;
    }
    .vis-code-block figcaption {
      margin: 0 0 6px; font-size: 12px; color: var(--muted-foreground);
    }
    .vis-code-block pre {
      margin: 0; white-space: pre-wrap;
      font: 12px/1.4 ui-monospace, Consolas, monospace;
    }
    .vis-category-surface.vis-blue { fill: color-mix(in srgb, var(--blue) 18%, var(--card)); }
    .vis-category-surface.vis-orange { fill: color-mix(in srgb, var(--orange) 18%, var(--card)); }
    .vis-category-surface.vis-success { fill: color-mix(in srgb, var(--success) 18%, var(--card)); }
    .vis-category-surface.vis-purple { fill: color-mix(in srgb, var(--purple) 18%, var(--card)); }
    .vis-chart-text { font-size: 12px; }
    code { font: 12px/1.4 ui-monospace, Consolas, monospace; }
    #uia-flow .urp-node { cursor: pointer; }
    #uia-flow .urp-node[aria-current="true"] rect { stroke-width: 2.5; }
    #uia-flow [hidden] { display: none !important; }
    .doc-note { margin: 0; color: var(--muted-foreground); font-size: 13px; }
    .doc-note a { color: var(--accent); }
    #urp-overview, #urp-detail-flow {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--background);
    }
    #urp-overview { border: 0; background: transparent; }
    #urp-detail-flow {
      min-height: 440px;
      display: block;
    }
    .urp-detail-list {
      margin: 0; padding-left: 18px;
      color: var(--muted-foreground); font-size: 13px;
    }
    .urp-detail-list li { margin: 4px 0; }
  </style>
</head>
<body>
  <div id="uia-flow">
    <p class="vis-sr-only">Interactive UIA recording and replay path diagrams. Switch mode, then select a stage for its detail flowchart.</p>
    <p class="doc-note" id="urp-doc-note">Companion to <a href="replay-flow.md">replay-flow.md</a> and <a href="recording-flow.md">recording-flow.md</a>.</p>

    <div class="vis-controls">
      <div class="vis-form-label">
        <span>Mode</span>
        <div class="vis-toggle-group" role="radiogroup" aria-label="Path mode">
          <input id="mode-replay" type="radio" name="urp-mode" value="replay" checked />
          <label for="mode-replay">Replay</label>
          <input id="mode-recording" type="radio" name="urp-mode" value="recording" />
          <label for="mode-recording">Recording</label>
        </div>
      </div>
      <label class="vis-form-label" id="urp-hub-wrap">
        <span>Hub source</span>
        <select id="urp-hub" class="vis-form-select" aria-controls="urp-detail">
          <option value="findall" selected>findall</option>
          <option value="uia_efp">uia_efp</option>
        </select>
      </label>
    </div>

    <div class="vis-column">
      <div class="vis-chart-meta">
        <div class="vis-chart-meta-copy">
          <h3 id="urp-overview-title">UIA replay path</h3>
          <span id="urp-overview-sub">Compile to hand move</span>
        </div>
        <div class="vis-legend" id="urp-legend"></div>
      </div>
      <svg id="urp-overview" viewBox="0 0 736 420" width="100%" role="img" aria-labelledby="urp-overview-title urp-overview-desc">
        <title id="urp-overview-title-svg">Overview flowchart</title>
        <desc id="urp-overview-desc">High-level stages for the selected mode.</desc>
        <defs>
          <marker id="urp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--foreground)"></path>
          </marker>
          <marker id="urp-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--muted-foreground)"></path>
          </marker>
        </defs>
        <g id="urp-overview-body"></g>
      </svg>
    </div>

    <div class="vis-column">
      <div class="vis-chart-meta">
        <div class="vis-chart-meta-copy">
          <h3 id="urp-detail-title">Stage detail</h3>
          <span id="urp-detail-sub">select a stage</span>
        </div>
      </div>
      <div id="urp-detail" class="vis-card" aria-live="polite">
        <div class="vis-column">
          <div class="vis-row">
            <span class="vis-badge vis-accent" id="urp-phase">—</span>
            <span class="vis-badge" id="urp-reason">—</span>
          </div>
          <div class="vis-row">
            <span class="vis-text-muted vis-text-small">file</span>
            <code id="urp-file">—</code>
          </div>
          <div class="vis-row">
            <span class="vis-text-muted vis-text-small">fn</span>
            <code id="urp-fn">—</code>
          </div>
          <figure class="vis-code-block">
            <figcaption>Key gate</figcaption>
            <pre><code id="urp-gate"></code></pre>
          </figure>
          <svg id="urp-detail-flow" viewBox="0 0 700 320" role="img" aria-label="Stage detail flowchart"></svg>
          <ul id="urp-bullets" class="urp-detail-list"></ul>
        </div>
      </div>
    </div>
  </div>
  <script>
  (function () {
    var root = document.getElementById("uia-flow");
    if (!root) return;

    var hubSel = root.querySelector("#urp-hub");
    var hubWrap = root.querySelector("#urp-hub-wrap");
    var overviewBody = root.querySelector("#urp-overview-body");
    var overviewSvg = root.querySelector("#urp-overview");
    var overviewTitle = root.querySelector("#urp-overview-title");
    var overviewSub = root.querySelector("#urp-overview-sub");
    var overviewDesc = root.querySelector("#urp-overview-desc");
    var legendEl = root.querySelector("#urp-legend");
    var titleEl = root.querySelector("#urp-detail-title");
    var subEl = root.querySelector("#urp-detail-sub");
    var phaseEl = root.querySelector("#urp-phase");
    var reasonEl = root.querySelector("#urp-reason");
    var fileEl = root.querySelector("#urp-file");
    var fnEl = root.querySelector("#urp-fn");
    var gateEl = root.querySelector("#urp-gate");
    var bulletsEl = root.querySelector("#urp-bullets");
    var detailSvg = root.querySelector("#urp-detail-flow");
    var mode = "replay";
    var currentStage = "select";
    var efpCueVisible = false;

    function esc(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function box(x, y, w, h, title, sub, tone) {
      var fill = "var(--card)";
      if (tone === "blue") fill = "color-mix(in srgb, var(--blue) 16%, var(--card))";
      if (tone === "orange") fill = "color-mix(in srgb, var(--orange) 16%, var(--card))";
      if (tone === "success") fill = "color-mix(in srgb, var(--success) 16%, var(--card))";
      if (tone === "purple") fill = "color-mix(in srgb, var(--purple) 16%, var(--card))";
      if (tone === "muted") fill = "var(--muted)";
      var t2 = sub
        ? '<text class="vis-chart-text" x="' + (x + w / 2) + '" y="' + (y + 36) + '" text-anchor="middle" fill="var(--muted-foreground)">' + esc(sub) + "</text>"
        : "";
      return (
        '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="8" fill="' + fill + '" stroke="var(--foreground)" stroke-width="1.5" vector-effect="non-scaling-stroke"></rect>' +
        '<text class="vis-chart-text" x="' + (x + w / 2) + '" y="' + (y + (sub ? 22 : 28)) + '" text-anchor="middle" fill="var(--foreground)">' + esc(title) + "</text>" +
        t2
      );
    }

    function node(stage, x, y, w, h, title, sub, tone) {
      var fill = "var(--card)";
      if (tone === "blue") fill = "color-mix(in srgb, var(--blue) 18%, var(--card))";
      if (tone === "orange") fill = "color-mix(in srgb, var(--orange) 18%, var(--card))";
      if (tone === "success") fill = "color-mix(in srgb, var(--success) 18%, var(--card))";
      if (tone === "purple") fill = "color-mix(in srgb, var(--purple) 18%, var(--card))";
      return (
        '<g class="urp-node" data-stage="' + esc(stage) + '" transform="translate(' + x + "," + y + ')">' +
        '<rect width="' + w + '" height="' + h + '" rx="8" fill="' + fill + '" stroke="var(--foreground)" stroke-width="1.5" vector-effect="non-scaling-stroke"></rect>' +
        '<text class="vis-chart-text" x="' + (w / 2) + '" y="24" text-anchor="middle" fill="var(--foreground)">' + esc(title) + "</text>" +
        '<text class="vis-chart-text" x="' + (w / 2) + '" y="42" text-anchor="middle" fill="var(--muted-foreground)">' + esc(sub) + "</text>" +
        "</g>"
      );
    }

    function diamond(cx, cy, title) {
      var s = 40;
      return (
        '<path d="M' + cx + " " + (cy - s) + " L" + (cx + s) + " " + cy + " L" + cx + " " + (cy + s) + " L" + (cx - s) + " " + cy + ' Z" fill="var(--muted)" stroke="var(--foreground)" stroke-width="1.5" vector-effect="non-scaling-stroke"></path>' +
        '<text class="vis-chart-text" x="' + cx + '" y="' + (cy + 4) + '" text-anchor="middle" fill="var(--foreground)">' + esc(title) + "</text>"
      );
    }

    function arrow(d, muted) {
      return (
        '<path d="' + d + '" fill="none" stroke="' + (muted ? "var(--muted-foreground)" : "var(--foreground)") +
        '" stroke-width="1.5" marker-end="url(#' + (muted ? "urp-arrow-muted" : "urp-arrow") + ')" vector-effect="non-scaling-stroke"></path>'
      );
    }

    function dArrow(d, muted) {
      return (
        '<path d="' + d + '" fill="none" stroke="' + (muted ? "var(--muted-foreground)" : "var(--foreground)") +
        '" stroke-width="1.5" marker-end="url(#' + (muted ? "urp-d-arrow-m" : "urp-d-arrow") + ')" vector-effect="non-scaling-stroke"></path>'
      );
    }

    function label(x, y, text, muted) {
      return (
        '<text class="vis-chart-text" x="' + x + '" y="' + y + '" fill="' +
        (muted ? "var(--muted-foreground)" : "var(--foreground)") + '">' + esc(text) + "</text>"
      );
    }

    function detailDefs() {
      return (
        "<defs>" +
        '<marker id="urp-d-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--foreground)"></path></marker>' +
        '<marker id="urp-d-arrow-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted-foreground)"></path></marker>' +
        "</defs>"
      );
    }

    function legend(items) {
      legendEl.innerHTML = items.map(function (it) {
        return '<span class="vis-legend-item"><span class="vis-swatch ' + it.cls + '"></span>' + esc(it.label) + "</span>";
      }).join("");
    }

    var replayStages = {
      compile: {
        title: "Compile tool call",
        sub: "（UIA） → move_mouse args",
        phase: "compile",
        reason: "findall | uia_efp",
        file: "compile_tool_calls.py / vision_context.py",
        fn: "_move_mouse_call · select_click_primary_candidate",
        gate: "candidates[0].source\nuia → findall · uia_efp → uia_efp",
        bullets: [
          "Both FindAll and EFP stay in the pool; typed precedence picks primary.",
          "0 concrete FindAll · 1 data_item EFP · 2 other UIA · 3 generic row hubs.",
          "Packs landmark_geometry, nearby_objects, click_window, optional hub_parent."
        ]
      },
      move: {
        title: "MCP move_mouse",
        sub: "tools → tool_module",
        phase: "resolve",
        reason: "miss raises",
        file: "cua_mcp/tools.py · tool_module.py",
        fn: "_move_mouse → resolve_mouse_point → find_mouse_point",
        gate: "soft miss → None\nhard miss → raise",
        bullets: [
          "find_mouse_point may retry once when capture MAD shows UI change.",
          "Drag resolves start and destination; scroll may hover then wheel."
        ]
      },
      attempt: {
        title: "Point attempt",
        sub: "window + OCR twin prep",
        phase: "選取 · 標題列 / FindAll",
        reason: "caption early exit",
        file: "select_mouse_target.py",
        fn: "_find_mouse_point_attempt",
        gate: "allow_uia_select && refine_with_uia && hwnd",
        bullets: [
          "Caption roles short-circuit to caption_button.",
          "filter_by_control_type only when vision_mode=uia."
        ]
      },
      findall: {
        title: "UIA FindAll snapshot",
        sub: "click_window pool",
        phase: "選取 · FindAll",
        reason: "empty → retry once",
        file: "select_mouse_target.py",
        fn: "_uia_only_detections_for_click_window",
        gate: "uia_efp may merge YOLO landmarks first",
        bullets: [
          "Phase badge: 選取 · FindAll (briefly 選取 · YOLO for constellation landmarks)."
        ]
      },
      select: null,
      commit: {
        title: "Commit hub center",
        sub: "offsets · char · scroll %",
        phase: "select_unique / uia_yolo_subtarget",
        reason: "uia_first_hit",
        file: "select_mouse_target.py",
        fn: "_find_mouse_point_attempt (post UIA-first)",
        gate: "no OCR twin or input/scrollbar/EFP synth → commit",
        bullets: [
          "Subtarget EFP soft-miss keeps hub when findall or EFP-verified reason."
        ]
      },
      fallback: {
        title: "Miss fallback",
        sub: "retry · twin · YOLO",
        phase: "選取 · YOLO / OCR",
        reason: "soft-miss keep findall",
        file: "select_mouse_target.py · uia_replay_repair.py",
        fn: "take_yolo_ocr_fallback",
        gate: "retry FindAll else OCR twin / force yolo_ocr",
        bullets: [
          "Queued YoloOcrMoveFallback rewrites instruction/nearby/landmarks."
        ]
      },
      hand: {
        title: "Hand execution",
        sub: "move · click · drag · scroll",
        phase: "action",
        reason: "gx, gy",
        file: "tool_module.py",
        fn: "hand_tools.move / drag / scroll_at",
        gate: "click after move; drag resolves 2 points",
        bullets: [
          "Click family: move_mouse then click/double_click/…"
        ]
      }
    };

    var recordingStages = {
      start: {
        title: "Session start",
        sub: "RecordingSession.start",
        phase: "start",
        reason: "folders + hooks",
        file: "app_main_hub.py · capture.py",
        fn: "_start_recording · RecordingSession.start",
        gate: "_accepting_input = True\n+ VisionPrefetchWorker",
        bullets: [
          "Creates events/, screenshots/, yolo_ocr/.",
          "Seeds settle windows; starts before-shot + pre-click loops."
        ]
      },
      capture: {
        title: "Live capture",
        sub: "events/event_NNN.json",
        phase: "persist",
        reason: "screenshot + UIA + EFP",
        file: "capture.py",
        fn: "_persist_queued_event · write_event_json",
        gate: "uia_snapshot when settle hwnd matches\nelement_from_point on worker",
        bullets: [
          "Stores cursor, click_window, monitor, modifiers.",
          "Later patches: window_change, focused_element, drag end_*."
        ]
      },
      prefetch: {
        title: "Vision prefetch",
        sub: "yolo_ocr/event_NNN.json",
        phase: "prefetch",
        reason: "async YOLO+OCR",
        file: "capture.py / vision prefetch worker",
        fn: "VisionPrefetchWorker",
        gate: "notify hub after persist\n→ often warm cache for analyze",
        bullets: [
          "Analyze can rebuild from this cache via try_rebuild_vision_from_cache."
        ]
      },
      stop: {
        title: "Stop / finalize",
        sub: "session.json",
        phase: "finalize",
        reason: "drain prefetch",
        file: "capture.py · main.py",
        fn: "begin_stop → finalize_stop → analyze_screen_recording",
        gate: "analyze=True → analyze_recording_session",
        bullets: [
          "Joins worker + window-step; writes final_after.jpeg."
        ]
      },
      analyze: {
        title: "Analyze session",
        sub: "prepare_event_vision",
        phase: "analyze",
        reason: "coalesce → vision → instruction",
        file: "orchestrator.py · analyze.py",
        fn: "analyze_recording_session · prepare_event_vision",
        gate: "caption shortcut / cache hit /\nelse build_vision_context_at_point",
        bullets: [
          "Then text_choice refine, analyze_event_to_cache, compile_tool_calls."
        ]
      },
      decide: {
        title: "UIA vs YOLO",
        sub: "_detect_recording_mouse_targets",
        phase: "vision_path",
        reason: "recording_uia_skip_reason",
        file: "vision_context.py",
        fn: "_detect_recording_mouse_targets · recording_uia_skip_reason",
        gate: "skip_reason is None → vision_path=uia\nelse yolo_ocr",
        bullets: [
          "Always run YOLO; inject EFP peer when usable.",
          "UIA sufficient: usable text/input/scrollbar under click, landmark unique hub, or EFP-labeled leaf.",
          "Weak EFP↔OCR disagree can demote UIA → YOLO."
        ]
      },
      primary: null,
      write: {
        title: "Analysis + twin",
        sub: "analysis/event_NNN.json",
        phase: "write",
        reason: "（UIA） or （YOLO+OCR）",
        file: "orchestrator.py · compile_tool_calls.py · uia_replay_repair.py",
        fn: "_write_event_analysis · compile_tool_calls · build_yolo_ocr_fallback_from_vision",
        gate: "UIA primary + YOLO detections\n→ yolo_ocr_fallback twin",
        bullets: [
          "move_mouse gets hub_source, EFP sidecar, click_window, landmarks.",
          "Replay repair promotion happens later at cache replay, not here."
        ]
      }
    };

    function replaySelectDetail(hub) {
      if (hub === "uia_efp") {
        return {
          title: "Constellation-EFP",
          sub: "then Name shortlist",
          phase: "選取 · FindAll",
          reason: "landmark_efp_* / hit",
          file: "select_mouse_target.py",
          fn: "_try_uia_first_unique_select",
          gate: "hub_source=uia_efp → constellation first",
          bullets: [
            "Reasons: landmark_efp_hit, _synth_hit, _neighbor_hit, uia_data_item_name_hit.",
            "EFP miss continues Name shortlist on UIA-family only."

    function bindOverviewNodes() {
      overviewBody.querySelectorAll(".urp-node").forEach(function (n) {

        n.setAttribute("aria-label", labelText ? labelText.textContent : n.getAttribute("data-stage"));
        function activate() {
          paintDetail(n.getAttribute("data-stage"));
        }
        n.addEventListener("click", activate);
        n.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            activate();
          }
        });

          { cls: "vis-success", label: "Artifacts" }
        ]);
        hubWrap.hidden = false;
        renderRecordingOverview();
      }
      bindOverviewNodes();
    }

    function paintDetail(stageKey) {
      var data = stageData(stageKey);
      if (!data) return;
      currentStage = stageKey;
      titleEl.textContent = data.title;
      subEl.textContent = data.sub;
      phaseEl.textContent = data.phase;
      reasonEl.textContent = data.reason;
      fileEl.textContent = data.file;
      fnEl.textContent = data.fn;
      gateEl.textContent = data.gate;
      bulletsEl.innerHTML = (data.bullets || [])
        .map(function (b) { return "<li>" + esc(b) + "</li>"; })
        .join("");
      renderDetailFlow(stageKey);
      overviewBody.querySelectorAll(".urp-node").forEach(function (n) {
        n.setAttribute("aria-current", n.getAttribute("data-stage") === stageKey ? "true" : "false");
      });
    }

    function paintAll() {
      paintOverview();
      var defaultStage = mode === "replay" ? "select" : "decide";
      if (!stageData(currentStage)) currentStage = defaultStage;
      paintDetail(currentStage);
    }

    root.querySelectorAll('input[name="urp-mode"]').forEach(function (input) {
      input.addEventListener("change", function () {
        if (!input.checked) return;
        mode = input.value;
        currentStage = mode === "replay" ? "select" : "decide";
        paintAll();
      });
    });

    hubSel.addEventListener("change", function () {
      paintOverview();
      paintDetail(currentStage);
    });

    paintAll();
  })();
  </script>
</body>
</html>
